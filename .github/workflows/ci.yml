name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system audio tools (sox, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y sox libsox-fmt-all ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests numpy opencv-python-headless pillow pymupdf pytesseract indic-transliteration

      - name: Python Syntax & Compilation Check
        run: |
          python -m py_compile ocr_pdf.py convert_to_markdown.py format_sanskrit_markdown.py devanagari_validator.py verify_accuracy.py vagdhenu_meter.py generate_audio_release.py

      - name: Run Unit Tests
        run: |
          pytest -v tests/test_devanagari_validator.py tests/test_vagdhenu_integration.py tests/test_audio_release.py

      - name: Audit Sanskrit Markdown Unicode Structure
        run: |
          python validate_devanagari.py PingreeYJ_1_Sanskrit.md

      - name: Generate Sample Audio Track
        run: |
          python generate_audio_release.py

      - name: Upload Audio Sample Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanskrit-audio-track
          path: |
            release_audio/yavanajataka_ch1_sample.mp3
            release_audio/yavanajataka_ch1_sample.wav
            release_audio/track_manifest.json
  model-serving-smoke:
    name: Model Serving & Inference Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests opencv-python-headless pillow

      - name: Start TensorFlow Serving Container
        run: |
          docker run -d --name tfserving \
            -p 8501:8501 \
            -v ${{ github.workspace }}/get_predictions/c3_attention:/models/sanskrit \
            -e MODEL_NAME=sanskrit \
            tensorflow/serving:1.15.0

          echo "Waiting for TensorFlow Serving model to initialize..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8501/v1/models/sanskrit | grep -q "AVAILABLE"; then
              echo "Model server is ready!"
              break
            fi
            sleep 1
          done

      - name: Run Inference Smoke Test
        run: |
          pytest -v tests/test_model_smoke.py

      - name: Stop Serving Container
        if: always()
        run: |
          docker stop tfserving || true
          docker rm tfserving || true
