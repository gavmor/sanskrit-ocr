name: Release Audio Track

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release-audio:
    name: Generate & Release Sanskrit Audio Track
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system audio tools (sox, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y sox libsox-fmt-all ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install indic-transliteration pytest

      - name: Generate Pārāyaṇa Recitation Track
        run: |
          python generate_parayana_chant.py
          python generate_audio_release.py

      - name: Run Audio Unit Tests
        run: |
          pytest -v tests/test_audio_release.py

      - name: Upload Audio Track Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanskrit-parayana-track
          path: |
            output/audio/yavanajataka_ch1_parayana.mp3
            output/audio/yavanajataka_ch1_parayana.wav
            output/audio/yavanajataka_ch1_parayana_text.md
            output/audio/parayana_manifest.json
            output/audio/yavanajataka_ch1_sample.mp3
            output/audio/yavanajataka_ch1_sample.wav
            output/audio/track_manifest.json
      - name: Prepare Release Notes
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          cat << 'EOF' > release_notes.md
          # The Yavanajātaka of Sphujidhvaja — Sanskrit Pārāyaṇa (पारायणम्) Release

          This release features the machine-transcribed Sanskrit text and metrically-aware sacred chant recitation (*Pārāyaṇa*) sampled from **David Pingree's critical edition of the *Yavanajātaka*** (Harvard Oriental Series Vol. 48; `PingreeYJ_1.pdf`).

          - **`yavanajataka_ch1_parayana.mp3`**: Complete 3.5-minute Sanskrit Pārāyaṇa recitation (Chapter 1, Verses 11–26: The Twelve Signs of the Zodiac) in 320 kbps MP3 format with full ID3 metadata.
          - **`yavanajataka_ch1_parayana.wav`**: Studio-quality 24 kHz mono PCM master recitation recording.
          - **`yavanajataka_ch1_parayana_text.md`**: Timed bilingual verse recitation sheet (Devanāgarī verses + Pingree Vol. 2 English translations).
          - **`parayana_manifest.json`**: Structured recitation metadata, timing, and Vāgdhenu metrical scansion (*Indravajrā / Upajāti*, 11 syllables per pāda).

          Full-book Sanskrit transcription (`PingreeYJ_1_Sanskrit.md`) is generated locally via `convert_to_markdown.py` (requires the source PDF and a running IndicOCR model server) and is not redistributed here; see the repository README for instructions.
          EOF

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If tag does not exist in git, create it
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG" || true
          fi

          gh release create "$RELEASE_TAG" \
            output/audio/yavanajataka_ch1_parayana.mp3 \
            output/audio/yavanajataka_ch1_parayana.wav \
            output/audio/yavanajataka_ch1_parayana_text.md \
            output/audio/parayana_manifest.json \
            output/audio/yavanajataka_ch1_sample.mp3 \
            output/audio/yavanajataka_ch1_sample.wav \
            output/audio/track_manifest.json \
            --title "Yavanajātaka Sanskrit Pārāyaṇa ($RELEASE_TAG)" \
            --notes-file release_notes.md \
            --latest || gh release upload "$RELEASE_TAG" \
              output/audio/yavanajataka_ch1_parayana.mp3 \
              output/audio/yavanajataka_ch1_parayana.wav \
              output/audio/yavanajataka_ch1_parayana_text.md \
              output/audio/parayana_manifest.json \
              output/audio/yavanajataka_ch1_sample.mp3 \
              output/audio/yavanajataka_ch1_sample.wav \
              output/audio/track_manifest.json \
              --clobber
